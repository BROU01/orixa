<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — ORIXA</title>
<meta name="description" content="Connectez-vous à votre compte ORIXA.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111110">
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body class="auth-body">
<a href="#main" class="skip-link">Aller au formulaire</a>

<header class="auth-top">
  <a href="../index.html" class="brand" aria-label="ORIXA, accueil"><span class="brand__mark">ORIXA</span></a>
  <a href="../index.html" class="auth-top__back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Retour à la boutique</span>
  </a>
</header>

<main class="auth-center" id="main">
  <div class="glass">
    <span class="glass__eyebrow">Cosmétiques &amp; produits exotiques</span>
    <h1 class="glass__title">Connexion</h1>
    <p class="glass__sub">Retrouvez vos commandes, vos favoris et vos adresses de livraison.</p>

    <form id="login-form" class="gform" novalidate>
      <div class="gfield">
        <label class="gfield__label" for="email">Adresse e-mail</label>
        <input class="gfield__input" id="email" name="email" type="email" autocomplete="email" required placeholder="vous@exemple.com">
        <p class="gfield__error" id="email-error" hidden></p>
      </div>

      <div class="gfield">
        <div class="gfield__row">
          <label class="gfield__label" for="password">Mot de passe</label>
          <a class="gfield__link" href="mot-de-passe-oublie.html">Mot de passe oublié&nbsp;?</a>
        </div>
        <div class="gfield__wrap">
          <input class="gfield__input" id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Au moins 6 caractères">
          <button type="button" class="gfield__toggle" data-toggle-password="password" aria-label="Afficher le mot de passe"><svg class="i-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a17.6 17.6 0 0 1 3.87-4.87"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 7 10 7a17.63 17.63 0 0 1-3.17 4.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg></button>
        </div>
        <p class="gfield__error" id="password-error" hidden></p>
      </div>

      <label class="gcheck">
        <input type="checkbox" name="remember"><span class="gcheck__box" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span>Rester connecté sur cet appareil</span>
      </label>

      <button type="submit" class="gbtn gbtn--solid">Se connecter</button>

      <div class="gdivider"><span>ou continuer avec</span></div>
          <div class="gsocials">
            <button type="button" class="gbtn gbtn--outline" aria-label="Continuer avec Google">
              <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>Google
            </button>
            <button type="button" class="gbtn gbtn--outline" aria-label="Continuer avec Apple">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>Apple
            </button>
          </div>

      <p class="gfoot">Nouveau sur ORIXA&nbsp;? <a href="inscription.html">Créer un compte</a></p>
    </form>
  </div>
</main>

<footer class="auth-foot">
  <p>© <span data-year>2026</span> ORIXA</p>
  <nav aria-label="Liens légaux">
    <a href="../contact.html">Aide</a>
    <a href="../legal.html#confidentialite">Confidentialité</a>
    <a href="../legal.html#cgv">Conditions</a>
  </nav>
</footer>

<script src="../assets/js/auth.js"></script>
</body>
</html>
